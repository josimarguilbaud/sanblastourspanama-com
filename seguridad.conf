# Cabeceras de seguridad (13/10/2026). Antes no había ninguna.
#
# Va en fichero aparte porque nginx NO hereda los add_header del server en
# una location que declara los suyos: /_astro/ y /fonts/ ponen Cache-Control,
# así que sin incluir esto también allí, esas respuestas salían sin cabeceras.
#
# La CSP solo fija lo que no rompe nada: quién puede enmarcar la web,
# <object>, <base> y el salto a https. Los scripts no se restringen a
# propósito: GTM, Chatwoot y el widget de reservas cargan de tres orígenes, y
# una lista blanca a ciegas tumba el cobro en silencio.
#
# Permissions-Policy NO menciona `payment`, a propósito. Una lista explícita
# (self + reservas) dejaba fuera los iframes de la pasarela NMI que Collect.js
# mete dentro del widget, y la consola daba «Could not create
# PaymentRequestAbstraction» (13/10/2026). Sin la directiva rige el valor por
# defecto, que es el que había: delegación por allow="payment".
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" always;
