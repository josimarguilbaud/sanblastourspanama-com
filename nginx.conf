server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Por qué existe este fichero (02/09/2026) ────────────────────────────
    #
    # No existía: el Dockerfile usaba `nginx:alpine` de serie. Las dos webs
    # hermanas sí lo tienen, y el comentario del Dockerfile de sanblasfull dice
    # «mismo patrón que el flagship sanblastourspanama.com» — el flagship era
    # justo el que lo había perdido.
    #
    # Sin él pasaban tres cosas, las tres medidas en producción:
    #   1. cada URL sin barra final costaba DOS saltos, y el primero salía por
    #      http:// en claro;
    #   2. el sitemap anunciaba `/blog/` y cada página declaraba `/blog` en su
    #      canonical, o sea dos direcciones distintas para la misma página;
    #   3. la página 404 del sitio no se servía nunca — nginx devolvía su 404
    #      gris de 153 bytes.

    # El proxy termina TLS y habla HTTP con este contenedor, así que nginx cree
    # que la petición llegó por http y construye las `Location` absolutas con
    # ese esquema. Sin esto, un 301 desde https acaba mandando a http:// y el
    # navegador da un salto más para volver.
    #
    # ⚠️ Al comprobarlo, mira la CABECERA CRUDA (`curl -D-`): `curl -w
    # '%{redirect_url}'` enseña la URL que resuelve curl, no la que manda
    # nginx, y hace creer que no cambió nada.
    absolute_redirect off;

    gzip on;
    # `text/html` ya lo comprime nginx por defecto; listarlo da un aviso.
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Barra final → sin barra ─────────────────────────────────────────────
    #
    # La forma canónica es SIN barra, y no es una preferencia: es la que declara
    # cada página en su `<link rel="canonical">` y la que usan los enlaces del
    # propio sitio. Medido en la portada el 02/09/2026: 85 enlaces internos sin
    # barra, 0 con barra. El único que decía lo contrario era el sitemap, y ya
    # no (`trailingSlash: 'never'` en astro.config.mjs).
    #
    # `$is_args$args` conserva la cadena de consulta: sin eso, una visita con
    # `?utm_source=...` pierde la atribución al redirigir.
    #
    # La raíz `/` no entra: el patrón exige al menos un carácter antes de la
    # barra final.
    location ~ ^(/.+)/$ {
        return 301 $1$is_args$args;
    }

    # Assets con hash: caché larga e inmutable.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Sin esto, quien se equivoca de URL ve el 404 gris de nginx en vez de la
    # página del sitio, que existe y está traducida a los cinco idiomas.
    error_page 404 /404.html;
}
